name: transaction-safe-bidding

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: bidding
      POSTGRES_USER: bidding
      POSTGRES_PASSWORD: bidding
    ports:
      - "54329:5432"
    volumes:
      # PostgreSQL 18 stores versioned data directories below this parent.
      - bidding-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidding -d bidding"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bidding:bidding@db:5432/bidding
      BID_STRATEGY: ${BID_STRATEGY:-pessimistic}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-2000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      OPTIMISTIC_MAX_ATTEMPTS: ${OPTIMISTIC_MAX_ATTEMPTS:-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s

volumes:
  bidding-postgres-data:
