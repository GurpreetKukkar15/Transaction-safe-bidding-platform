[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-safe-bidding-platform"
version = "0.1.0"
description = "A correctness and performance study of auction concurrency-control strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
bidding-migrate = "bidding.db.migrations:main"
bidding-benchmark = "bidding.benchmark.cli:main"
bidding-http-benchmark = "bidding.benchmark.http_cli:main"
bidding-benchmark-report = "bidding.benchmark.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bidding.db" = ["sql/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
